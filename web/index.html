<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: http://127.0.0.1:* piphin:; media-src 'self' blob: mediastream: http://127.0.0.1:*; style-src 'self' 'unsafe-inline' piphin:; script-src 'self'; font-src 'self' data: piphin:">
  <title>Piphin Captura</title>
  <link rel="stylesheet" href="piphin://ui/kit.css">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="in-hub">
  <nav class="p-subnav" id="nav">
    <button class="nav" data-tab="home"><i class="i i-camera"></i>Capturar</button>
    <button class="nav" data-tab="gallery"><i class="i i-images"></i>Galeria</button>
    <button class="nav" data-tab="settings"><i class="i i-settings"></i>Ajustes</button>
    <div class="grow"></div>
    <button class="rec-pill" id="recPill" hidden></button>
  </nav>
  <main id="content"></main>

  <!-- editor de print (abre por cima de tudo) -->
  <section class="editor" id="editor" hidden>
    <header class="ed-bar">
      <div class="tools" id="tools"></div>
      <span class="sep"></span>
      <div class="swatches" id="swatches"></div>
      <div class="sizes" id="sizes"></div>
      <span class="sep"></span>
      <button class="btn icon ghost sm" data-ed="undo" title="Desfazer (Ctrl+Z)"><i class="i i-undo-2"></i></button>
      <button class="btn icon ghost sm" data-ed="redo" title="Refazer (Ctrl+Y)"><i class="i i-redo-2"></i></button>
      <div class="grow"></div>
      <button class="btn sm" data-ed="copy" title="Copiar (Ctrl+C)"><i class="i i-copy"></i>Copiar</button>
      <button class="btn icon sm" data-ed="saveas" title="Salvar como..."><i class="i i-download"></i></button>
      <button class="btn sm primary" data-ed="save" title="Salvar (Ctrl+S)"><i class="i i-check"></i>Salvar</button>
      <button class="btn icon ghost sm" data-ed="close" title="Fechar (Esc)"><i class="i i-x"></i></button>
    </header>
    <div class="ed-stage" id="stage"><canvas id="cv"></canvas><textarea id="textIn" hidden spellcheck="false"></textarea></div>
    <footer class="ed-foot"><span id="edInfo"></span><span class="faint" id="edHint"></span></footer>
  </section>

  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" class="toasts"></div>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
